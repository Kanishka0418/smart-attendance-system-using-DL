<!DOCTYPE html>
<html>

<head>

    <title>Face Attendance System</title>

    <style>

        body {
            font-family: Arial;
            background: #f4f7fb;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 80px auto;
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        .buttons {
            margin-top: 35px;
        }

        .button {
            display: inline-block;
            padding: 15px 25px;
            margin: 10px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .button:hover {
            background: #388E3C;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Face Recognition Attendance System</h1>

    <p>
        Deep Learning Based Student Attendance Management
    </p>

    <div class="buttons">

        <a href="/register" class="button">
            Student Registration
        </a>

        <a href="/attendance" class="button">
            Mark Attendance
        </a>

        <a href="/od" class="button">
            OD Letter
        </a>

        <a href="/report" class="button">
            Attendance Report
        </a>

    </div>

</div>

</body>

</html>
