<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 50px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #388E3C;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #555;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Student Registration</h1>

        <p class="subtitle">
            Register student details and face image
        </p>

        <form method="POST" enctype="multipart/form-data">

            <label>Student Name</label>
            <input type="text" name="name" required>

            <label>Register Number</label>
            <input type="text" name="register_number" required>

            <label>Department</label>
            <input type="text" name="department" required>

            <label>Face Image</label>
            <input type="file" name="face_image" accept="image/*" required>

            <button type="submit">
                Register Student
            </button>

        </form>

        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</body>

</html>
